<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório dos Agentes</title>
<style>
  :root { --bg:#0e0f14; --panel:#171923; --line:#2a2d3a; --txt:#e8e8ef; --mut:#8b8fa3; --ok:#3ddc84; --err:#ff5c5c; --run:#ffd166; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 ui-monospace, Menlo, monospace; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header .st { color:var(--mut); font-size:12px; }
  header .st.off { color:var(--err); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 380px; height:calc(100vh - 44px); }
  #wrap { position:relative; overflow:auto; background:#0a0b10; }
  #stage { display:inline-block; padding:12px; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer; display:block; }
  #zoom { position:absolute; left:14px; top:14px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  #zoom button { width:34px; height:34px; margin:0; background:#23263a; border:2px solid #4a4f66; color:#fff; font-size:20px; border-radius:6px; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px; }
  aside h2 { margin:0 0 2px; font-size:16px; }
  aside .cargo { color:var(--mut); font-size:12px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
  input, select, textarea { width:100%; background:#0e0f14; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  input[type=checkbox] { width:auto; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:4px; padding:8px 12px; font:inherit; cursor:pointer; margin-top:12px; }
  button.sec { background:#2a2d3a; } button.stop { background:#7a2323; }
  .run { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:8px; font-size:12px; }
  .run .t { display:flex; justify-content:space-between; gap:8px; }
  .bar { height:6px; background:#0e0f14; border-radius:3px; margin:6px 0; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--run); width:0; transition:width .4s; }
  .s-ok { color:var(--ok); } .s-falhou, .s-interrompido { color:var(--err); } .s-rodando { color:var(--run); } .s-fila, .s-parado { color:var(--mut); }
  pre { background:#0a0b10; border:1px solid var(--line); border-radius:4px; padding:8px; font-size:11px; max-height:260px; overflow:auto; white-space:pre-wrap; }
  .hint { color:var(--mut); font-size:12px; }
  .off { background:#2a1616; border:1px solid #5a2323; border-radius:6px; padding:10px; font-size:12px; margin-bottom:12px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>🏢 Escritório dos Agentes</h1><span class="st" id="hdr">conectando...</span></header>
<main>
  <div id="wrap"><div id="zoom"><button id="zin">+</button><button id="zout">−</button></div>
    <div id="stage"><canvas id="cv" width="480" height="320"></canvas></div></div>
  <aside id="panel"></aside>
</main>
<script>
// ------------------------------------------------------------ config
const qs = new URLSearchParams(location.search);
const API = qs.get('api') || (location.hostname.endsWith('github.io') || location.protocol === 'file:' ? 'http://localhost:8765' : '');
const DEMO_AG = [
  {id:'render', nome:'Rê', cargo:'Render de criativos', sala:'render', cor:'#e0457b', pele:'#f1c27d', cabelo:'#5a2d0c', tarefas:[]},
  {id:'tiktok', nome:'Tico', cargo:'Downloads do TikTok', sala:'download', cor:'#2bb5b5', pele:'#c68642', cabelo:'#111111', tarefas:[]},
  {id:'minerador', nome:'Mina', cargo:'Mineração de bases', sala:'mineracao', cor:'#e6b800', pele:'#8d5524', cabelo:'#2b1b0e', tarefas:[]}];
let AG = [], RUNS = [], sel = null, tick = 0, selTask = {}, showLog = {}, online = false, zoom = 2;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const W = 480, H = 320, T = 16;

// ------------------------------------------------------------ pixel helpers
function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(Math.round(x),Math.round(y),w,h); }
function spr(x,y,rows,pal,flip){ x=Math.round(x); y=Math.round(y); for(let j=0;j<rows.length;j++){ const r=rows[j]; for(let i=0;i<r.length;i++){ const c=pal[r[i]]; if(c) { cx.fillStyle=c; cx.fillRect(flip? x+r.length-1-i : x+i, y+j,1,1);} } } }
function text(s,x,y,c='#cfd2e0',size=8){ cx.fillStyle=c; cx.font=`${size}px monospace`; cx.fillText(s,Math.round(x),Math.round(y)); }

// ------------------------------------------------------------ layout (em pixels do canvas 480x320)
// area de mesas (piso de madeira): x 0..288 ; copa (piso claro) x 288..480 y 24..168 ; lounge (carpete azul) x 288..480 y 168..320
const SALAS = { render:{x:0,y:24,w:288,h:296,nome:'RENDER'}, download:{x:288,y:24,w:192,h:144,nome:'COPA • DOWNLOADS'}, mineracao:{x:288,y:168,w:192,h:152,nome:'LOUNGE • MINERAÇÃO'} };
const MESAS = { render:{x:56,y:96}, tiktok:{x:176,y:96}, minerador:{x:56,y:208} };            // posicao da mesa (topo-esquerda)
const TRAB = { render:{x:200,y:230}, download:{x:352,y:120}, mineracao:{x:400,y:250} };         // onde o agente fica quando trabalha
const pos = {};

const PLANT = ['..gg..','.gGgg.','gGggGg','.gggg.','..pp..','.pPPp.','.pppp.'], PPAL={g:'#3f9d4a',G:'#7ad47a',p:'#a0522d',P:'#c97b4a'};
const MON  = ['dddddddddd','dssssssssd','dsSSSSsssd','dssssssssd','dddddddddd','....dd....','..dddddd..'], MPAL={d:'#1c1e2a',s:'#2f6fd6',S:'#8ec5ff'};
const MON2 = ['dddddddddd','dssssssssd','dsSSSSsssd','dssssssssd','dddddddddd','....dd....','..dddddd..'], MPAL2={d:'#1c1e2a',s:'#3ddc84',S:'#c8ffe0'};
const CHAIR= ['.bbbbbb.','bBBBBBBb','bBBBBBBb','.bbbbbb.','..b..b..'], CPAL={b:'#2a2d3a',B:'#3d4152'};
const VEND = ['wwwwwwwwwwww','wrrrrrrrrrrw','wrbbbbbbbbrw','wrb.g.y.r.rw','wrbbbbbbbbrw','wrb.b.g.c.rw','wrbbbbbbbbrw','wrb.r.y.b.rw','wrbbbbbbbbrw','wrrrrrrrrrrw','wrrkkkkkkrrw','wrrrrrrrrrrw','wwwwwwwwwwww','.w........w.'], VPAL={w:'#cfd2e0',r:'#c0392b',b:'#222',g:'#3ddc84',y:'#ffd166',c:'#4fc3f7',k:'#111'};
const COOL = ['..cccc..','.cCCCCc.','.cCCCCc.','.cccccc.','..wwww..','..wwww..','..wwww..','..wwww..','..wwww..','.wwwwww.','.wwwwww.','..k..k..'], CPAL2={c:'#4fc3f7',C:'#b3e5fc',w:'#e6e6ee',k:'#333'};
const CLOCK= ['..wwww..','.wkkkkw.','wk..k.kw','wk..k.kw','wk.kk..w','wk.....w','.wkkkkw.','..wwww..'], KPAL={w:'#eee',k:'#222'};
const COUCH= ['..bbbbbbbbbbbbbbbbbb..','.bBBBBBBBBBBBBBBBBBBb.','bBBBBBBBBBBBBBBBBBBBBb','bBBbbbbbbbbbbbbbbbbBBb','bBBBBBBBBBBBBBBBBBBBBb','bBBBBBBBBBBBBBBBBBBBBb','.bbbbbbbbbbbbbbbbbbbb.','.kk................kk.'], CoPAL={b:'#7a2f3a',B:'#a8404f',k:'#222'};
const BOX  = ['pppppppp','pPPPPPPp','pP.ll.Pp','pPPPPPPp','pPPPPPPp','pppppppp'], BPAL={p:'#8b5a2b',P:'#b67a3c',l:'#e0c9a6'};
const PIC  = ['gggggggggg','gssssssssg','gsSSsyyssg','gsSSSyyssg','gsbbbbbbsg','gggggggggg'], PiPAL={g:'#c9a400',s:'#87ceeb',S:'#fff',y:'#ffd166',b:'#3f9d4a'};

function drawFloorWood(x,y,w,h){ for(let py=y;py<y+h;py+=T) for(let pxx=x;pxx<x+w;pxx+=T){ const k=((pxx/T)|0)%3; px(pxx,py,T,T,k==0?'#b98150':k==1?'#c08858':'#b37a48'); px(pxx+T-1,py,1,T,'#8f5f33'); px(pxx,py+T-1,T,1,'#a86f3e'); if(((py/T)+(pxx/T))%5==0) px(pxx+3,py+6,7,1,'#8f5f33'); } }
function drawFloorTile(x,y,w,h){ for(let py=y;py<y+h;py+=T) for(let pxx=x;pxx<x+w;pxx+=T){ px(pxx,py,T,T,((pxx+py)/T)%2?'#d9cfb8':'#cfc4aa'); px(pxx,py,T,1,'#bfb39a'); px(pxx,py,1,T,'#bfb39a'); } }
function drawFloorCarpet(x,y,w,h){ for(let py=y;py<y+h;py+=T) for(let pxx=x;pxx<x+w;pxx+=T){ px(pxx,py,T,T,((pxx+py)/T)%2?'#2f4f7f':'#2a4772'); px(pxx+4,py+4,2,2,'#3b5f94'); px(pxx+10,py+10,2,2,'#3b5f94'); } }
function drawWall(x,y,w){ px(x,y,w,20,'#6f6c82'); for(let i=0;i<w;i+=16) px(x+i,y+6,15,1,'#66637a'); px(x,y+20,w,4,'#3e3c4d'); }
function drawShelf(x,y){ px(x,y,48,28,'#6b4222'); px(x+2,y+2,44,11,'#3d2412'); px(x+2,y+15,44,11,'#3d2412'); const cols=['#c0392b','#2b6cff','#3ddc84','#ffd166','#9b59b6','#e67e22','#4fc3f7'];
  for(let i=0;i<9;i++){ px(x+4+i*4.5,y+4,3,8,cols[i%7]); px(x+4+i*4.5,y+17,3,8,cols[(i+3)%7]); } px(x,y+28,48,2,'#2b1a0c'); }
function drawDesk(m, a, busy){ px(m.x,m.y,64,26,'#a0693a'); px(m.x,m.y,64,3,'#c48a55'); px(m.x,m.y+23,64,3,'#7a4a22'); px(m.x+2,m.y+26,4,10,'#5a3416'); px(m.x+58,m.y+26,4,10,'#5a3416');
  spr(m.x+22,m.y-2,MON, busy?MPAL2:MPAL); px(m.x+44,m.y+8,10,6,'#e6e6ee'); px(m.x+8,m.y+12,8,4,'#1c1e2a'); px(m.x+46,m.y+16,12,5,'#7a4a22'); px(m.x+50,m.y+18,4,1,'#c48a55'); spr(m.x+28,m.y+50,CHAIR,CPAL); }

function drawRoom(){
  drawFloorWood(0,24,288,296); drawFloorTile(288,24,192,144); drawFloorCarpet(288,168,192,152);
  px(286,24,3,296,'#33323f'); px(288,166,192,3,'#33323f');
  drawWall(0,0,480);
  for(let i=0;i<5;i++) drawShelf(8+i*54,2);                       // estantes na parede
  spr(300,26,VEND,VPAL); spr(316,28,COOL,CPAL2); spr(440,4,CLOCK,KPAL); spr(400,6,PIC,PiPAL);
  spr(8,40,BOX,BPAL); spr(14,34,BOX,BPAL); spr(8,60,PLANT,PPAL); spr(268,30,PLANT,PPAL);
  spr(296,150,PLANT,PPAL); spr(460,150,PLANT,PPAL); spr(300,180,PLANT,PPAL);
  spr(392,286,COUCH,CoPAL); px(330,200,64,26,'#6b4222'); px(332,202,60,10,'#3d2412'); px(332,214,60,10,'#3d2412');  // estante lounge
  for(let i=0;i<7;i++){ px(335+i*8,204,5,7,['#c0392b','#2b6cff','#3ddc84','#ffd166','#9b59b6','#e67e22','#4fc3f7'][i]); px(335+i*8,216,5,7,['#4fc3f7','#e67e22','#9b59b6','#ffd166','#3ddc84','#2b6cff','#c0392b'][i]); }
  // sala de render: telao
  px(120,150,120,52,'#1c1e2a'); px(124,154,54,44, agRun('render')?'#e0457b':'#3b2a44'); px(182,154,54,44, agRun('render')?'#3ddc84':'#2a3d33'); text('RENDER',122,146,'#9aa0b8',7);
  px(160,206,40,6,'#2a2d3a');
  text('COPA',292,36,'#5c5747',7); text('LOUNGE',292,180,'#9fb7dc',7);
  for(const a of AG){ const m=MESAS[a.id]; drawDesk(m,a,!!agRun(a.id)); text(a.nome.toUpperCase(),m.x,m.y+52,'#f0e6c8',7); }
}

// ------------------------------------------------------------ personagens
function drawAgent(a,p,state,dir){
  const walk = state==='walk' ? Math.floor(tick/6)%2 : 0, bob = state==='work' ? Math.floor(tick/10)%2 : 0;
  const x=Math.round(p.x), y=Math.round(p.y)-bob, S=a.pele, Hh=a.cabelo, C=a.cor, K='#1e2030', E='#111', M='#c9756b';
  // cabeca 12x12, corpo 12x10, pernas
  px(x+1,y,12,3,Hh); px(x,y+3,14,7,S); px(x,y+2,2,4,Hh); px(x+12,y+2,2,4,Hh); px(x+1,y-1,12,1,Hh);
  if(dir==='down'||dir==='left'||dir==='right'){ px(x+3,y+5,2,2,E); px(x+9,y+5,2,2,E); px(x+6,y+8,2,1,M); }
  else { px(x+1,y+3,12,5,Hh); }
  px(x+1,y+10,12,9,C); px(x-2,y+11,3,6,S); px(x+13,y+11,3,6,S); px(x+3,y+12,8,2,'#ffffff22');
  px(x+2,y+19,4,6-walk*2,K); px(x+8,y+19,4,4+walk*2,K); px(x+2,y+25-walk*2,4,2,'#3d2412'); px(x+8,y+23+walk*2,4,2,'#3d2412');
  if(sel===a.id){ cx.strokeStyle='#fff'; cx.lineWidth=1; cx.strokeRect(x-3.5,y-3.5,21,32); }
}
function bubble(x,y,s){ cx.font='7px monospace'; s=s.slice(0,34); const w=Math.min(190,cx.measureText(s).width+8); px(x,y-14,w,12,'#f8f8fb'); px(x+1,y-15,w-2,14,'#f8f8fb'); px(x+5,y-2,5,3,'#f8f8fb'); text(s,x+4,y-5,'#111',7); }

function agRun(id){ return RUNS.find(r=>r.agente===id && r.status==='rodando'); }
function agQueue(id){ return RUNS.filter(r=>r.agente===id && r.status==='fila').length; }
function lastRun(id){ return RUNS.find(r=>r.agente===id); }

function frame(){
  tick++; drawRoom();
  for(const a of AG){
    const run=agRun(a.id), q=agQueue(a.id), last=lastRun(a.id);
    const target = run ? TRAB[a.sala] : {x:MESAS[a.id].x+26, y:MESAS[a.id].y+22};
    const p = pos[a.id] || (pos[a.id]={x:target.x,y:target.y,dir:'up'});
    const dx=target.x-p.x, dy=target.y-p.y, d=Math.hypot(dx,dy), walking=d>1;
    if(walking){ const v=Math.min(1.5,d); p.x+=dx/d*v; p.y+=dy/d*v; p.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }
    else p.dir = run ? 'down' : 'up';
    drawAgent(a,p, walking?'walk':(run?'work':'idle'), p.dir);
    if(run){ const pct = run.total ? Math.min(1,run.ok/run.total) : null;
      px(p.x-6,p.y-22,26,5,'#0b0c10'); if(pct!==null) px(p.x-5,p.y-21,24*pct,3,'#ffd166'); else px(p.x-5+(tick%24),p.y-21,5,3,'#ffd166');
      bubble(p.x-8,p.y-26,(pct!==null?Math.round(pct*100)+'% ':'')+(run.ultima||'')); }
    else if(q) bubble(p.x-8,p.y-22,`${q} na fila`);
    else if(last && Date.now()/1000-(last.fim||0)<90) bubble(p.x-8,p.y-22,(last.status==='ok'?'✓ ':'✗ ')+(last.ultima||''));
  }
  requestAnimationFrame(frame);
}
function fitZoom(){ const w=document.getElementById('wrap').clientWidth-24, h=document.getElementById('wrap').clientHeight-24; return Math.max(1, Math.floor(Math.min(w/W, h/H)*2)/2); }
function setZoom(z){ zoom=Math.max(1,Math.min(4,z)); cv.style.width=(W*zoom)+'px'; cv.style.height=(H*zoom)+'px'; }
document.getElementById('zin').onclick=()=>setZoom(zoom+0.5); document.getElementById('zout').onclick=()=>setZoom(zoom-0.5); window.addEventListener('resize',()=>setZoom(fitZoom()));
cv.addEventListener('click', e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  for(const a of AG){ const p=pos[a.id]; if(p && x>p.x-8 && x<p.x+24 && y>p.y-28 && y<p.y+30){ sel=a.id; renderPanel(); return; } } });

// ------------------------------------------------------------ painel
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtT(t){ return t? new Date(t*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function dur(r){ const e=(r.fim||Date.now()/1000)-(r.inicio||0); return e<60?Math.round(e)+'s':Math.round(e/60)+'min'; }
function offlineBox(){ return online ? '' : `<div class="off">Servidor local offline. No Mac, rode <b>~/bin/escritorio.sh</b> (ou <b>python3 ~/Downloads/criativo-gen/escritorio/server.py</b>) e recarregue. Se o navegador bloquear a conexão com localhost, abra a cópia local: <a href="http://localhost:8765" style="color:#8ec5ff">http://localhost:8765</a>. Outro endereço: <b>?api=http://ip:8765</b>.</div>`; }
function renderPanel(){
  const a=AG.find(x=>x.id===sel);
  if(!a){ document.getElementById('panel').innerHTML = offlineBox()+`<h2>Clique num agente</h2><div class="cargo">Rê renderiza criativos, Tico baixa TikToks e Mina minera bases novas.</div><div class="hint">Cada agente tem fila própria: tarefas do mesmo agente rodam uma de cada vez. Use + e − para dar zoom.</div>`; return; }
  let h=offlineBox()+`<h2>${esc(a.nome)}</h2><div class="cargo">${esc(a.cargo)}</div>`;
  if(a.tarefas.length){
    const tid = selTask[a.id] || a.tarefas[0].id, t=a.tarefas.find(x=>x.id===tid);
    const saved = JSON.parse(localStorage.getItem('form:'+a.id+':'+tid)||'{}');
    h+=`<label>Tarefa</label><select id="task">${a.tarefas.map(x=>`<option value="${x.id}" ${x.id===tid?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>`;
    for(const p of t.params){ const v = saved[p.k] ?? p.default; h+=`<label>${esc(p.label)}</label>`;
      if(p.type==='textarea') h+=`<textarea data-k="${p.k}">${esc(v)}</textarea>`;
      else if(p.type==='select') h+=`<select data-k="${p.k}">${p.options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
      else if(p.type==='checkbox') h+=`<input type="checkbox" data-k="${p.k}" ${v?'checked':''}>`;
      else h+=`<input type="${p.type==='number'?'number':'text'}" step="any" data-k="${p.k}" value="${esc(v)}">`; }
    h+=`<button id="go">▶ Executar</button> <span id="msg" class="hint"></span>`;
  }
  const mine = RUNS.filter(r=>r.agente===a.id).slice(0,8);
  h+=`<h2 style="margin-top:18px;font-size:13px">Execuções</h2>`; if(!mine.length) h+=`<div class="hint">nenhuma ainda</div>`;
  for(const r of mine){ const pct = r.total? Math.min(100,Math.round(r.ok/r.total*100)) : (r.status==='ok'?100:0);
    h+=`<div class="run"><div class="t"><b>${esc(r.tarefa_nome)}</b><span class="s-${r.status}">${r.status}</span></div>
      <div class="hint">${fmtT(r.inicio)} • ${dur(r)}${r.total?` • ${r.ok}/${r.total}`:''}${r.fail?` • <span class="s-falhou">${r.fail} falhas</span>`:''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="hint">${esc(r.ultima||'')}</div>
      <div>${r.status==='rodando'||r.status==='fila'?`<button class="stop" data-stop="${r.id}">■ Parar</button> `:''}<button class="sec" data-log="${r.id}">${showLog[r.id]?'Ocultar log':'Ver log'}</button> <button class="sec" data-open="${esc(r.out_dir||'')}">📁 Abrir pasta</button></div>
      ${showLog[r.id]?`<pre id="log-${r.id}">carregando...</pre>`:''}</div>`; }
  document.getElementById('panel').innerHTML=h;
  const ts=document.getElementById('task'); if(ts) ts.onchange=e=>{ selTask[a.id]=e.target.value; renderPanel(); };
  const go=document.getElementById('go'); if(go) go.onclick=async()=>{
    const tid = selTask[a.id] || a.tarefas[0].id; const params={}; document.querySelectorAll('#panel [data-k]').forEach(el=>{ params[el.dataset.k]= el.type==='checkbox'? el.checked : el.value; });
    localStorage.setItem('form:'+a.id+':'+tid, JSON.stringify(params));
    try{ const res=await fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:a.id,tarefa:tid,params})}).then(r=>r.json());
      document.getElementById('msg').textContent = res.erro? 'erro: '+res.erro : 'na fila: '+res.id; }catch(e){ document.getElementById('msg').textContent='servidor offline'; }
    await poll(); };
  document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=async()=>{ await fetch(API+'/api/stop/'+b.dataset.stop,{method:'POST'}); await poll(); });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>fetch(API+'/api/abrir?path='+encodeURIComponent(b.dataset.open)));
  document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{ showLog[b.dataset.log]=!showLog[b.dataset.log]; renderPanel(); });
  for(const r of mine) if(showLog[r.id]) fetch(API+'/api/log/'+r.id+'?tail=120').then(x=>x.json()).then(j=>{ const el=document.getElementById('log-'+r.id); if(el){ el.textContent=j.log||'(vazio)'; el.scrollTop=el.scrollHeight; } });
}

let lastSig='';
async function poll(){
  try{ const j=await fetch(API+'/api/status').then(r=>r.json()); RUNS=j.runs; const was=online; online=true;
    if(!was){ AG=await fetch(API+'/api/agentes').then(r=>r.json()); renderPanel(); }
    const running=RUNS.filter(r=>r.status==='rodando').length, fila=RUNS.filter(r=>r.status==='fila').length;
    const h=document.getElementById('hdr'); h.className='st'; h.textContent=`${running} rodando • ${fila} na fila • ${new Date().toLocaleTimeString('pt-BR')}`;
    const sig=JSON.stringify(RUNS.slice(0,10).map(r=>[r.id,r.status,r.ok,r.ultima]));
    if(sig!==lastSig && !document.activeElement.matches('input,textarea,select')){ lastSig=sig; renderPanel(); }
  }catch(e){ const was=online; online=false; const h=document.getElementById('hdr'); h.className='st off'; h.textContent='servidor local offline (rode ~/bin/escritorio.sh)'; if(was||!AG.length){ if(!AG.length) AG=DEMO_AG; renderPanel(); } }
}
(async()=>{ setZoom(fitZoom()); await poll(); if(!AG.length){ AG=DEMO_AG; renderPanel(); } frame(); setInterval(poll,2000); })();
</script>
